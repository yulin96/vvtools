appId: com.vvtools.app
productName: VVTools
directories:
  buildResources: build
extraResources:
  - from: .release/release-notes.md
    to: release-notes.md
  - from: .media-bin/current
    to: bin
    filter:
      - '**/*'
releaseInfo:
  releaseNotesFile: .release/release-notes.md
files:
  - 'out/**/*'
  - 'resources/**/*'
  - THIRD_PARTY_NOTICES.md
publish:
  provider: github
  owner: yulin96
  repo: vvtools
  private: false
  releaseType: release
asarUnpack:
  - '**/*.node'
  - 'node_modules/sharp/**'
  - 'node_modules/@img/**'
win:
  icon: build/icon.ico
  executableName: vvtools
  extraResources:
    - from: .release/shell/vvtools-shell.dll
      to: shell/vvtools-shell.dll
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/desktop-integration.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  identity: '-'
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
    - target: zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: VVTools
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
