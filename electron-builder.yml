appId: com.vvtools.app
productName: VVTools
directories:
  buildResources: build
extraResources:
  - from: .release/release-notes.md
    to: release-notes.md
  - from: .release/update-config.json
    to: update-config.json
  - from: .media-bin/current
    to: bin
    filter:
      - '**/*'
releaseInfo:
  releaseNotesFile: .release/release-notes.md
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,release-notes.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
publish:
  provider: generic
  url: ${env.VVTOOLS_UPDATE_BASE_URL}/${os}-${arch}
asarUnpack:
  - '**/*.node'
  - 'node_modules/sharp/**'
  - 'node_modules/@img/**'
win:
  executableName: vvtools
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
    - target: zip
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: VVTools
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
